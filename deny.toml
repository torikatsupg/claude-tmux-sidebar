# cargo-deny: supply-chain checks for Cargo dependencies, run in CI.
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
]

# Known vulnerabilities, unmaintained crates and yanked versions (RustSec advisory database).
[advisories]
yanked = "deny"

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSL-1.0",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
# Duplicate versions come and go with upstream releases; worth noticing, not worth failing CI over.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

# Only crates.io; a dependency swapped for a git repository or another registry fails CI.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
