[package]
name = "claude-tmux-sidebar"
version = "0.7.4"
edition.workspace = true
rust-version.workspace = true
description = "A tmux sidebar listing every Claude Code session with live status"
license = "MIT"
repository = "https://github.com/torikatsupg/claude-tmux-sidebar"
publish = false

[dependencies]
itertools = "0.15.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
rustix = { version = "1.1.5", default-features = false, features = ["std", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-width = "0.2.2"

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"

[lints]
workspace = true

[profile.release]
codegen-units = 1
lto = true
strip = true

[workspace]
members = ["xtask"]

[workspace.package]
edition = "2024"
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Nearly every function here is pure; marking them all #[must_use] adds noise, not safety.
must_use_candidate = "allow"
# The library exists for testing the binary; it has no outside callers to document errors for.
missing_errors_doc = "allow"
# Type safety: no silent panics or lossy casts.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
as_conversions = "deny"
# Small functions (threshold in clippy.toml) and explicit side effects.
too_many_lines = "deny"
print_stdout = "warn"
dbg_macro = "deny"
