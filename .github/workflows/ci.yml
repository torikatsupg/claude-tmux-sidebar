name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs the toolchain pinned in rust-toolchain.toml and caches the build.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: shell tools
        run: sudo apt-get install -y shellcheck shfmt
      - name: cargo xtask ci
        run: cargo xtask ci

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo test --workspace --locked
